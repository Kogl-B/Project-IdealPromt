name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать вручную

permissions:
  contents: write  # Необходимо для создания релизов

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="LetterGenerator" letter_generator_app.py
    
    - name: Create release package
      run: |
        mkdir release
        copy dist\LetterGenerator.exe release\
        copy INSTALL.txt release\
        copy README_APP.md release\README.md
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LetterGenerator-Windows
        path: release/
        retention-days: 90
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/LetterGenerator.exe
          release/INSTALL.txt
          release/README.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
